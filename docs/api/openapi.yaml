openapi: 3.1.0
info:
  title: MovieHub API
  version: 1.0.0
  description: MovieHub Enterprise modular monolith API. Authenticated write operations use bearer access tokens; payment confirmation is accepted only from a verified provider webhook.
servers:
  - url: http://localhost:5000
paths:
  /health/live:
    get:
      summary: Liveness probe
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      summary: Readiness probe
      responses:
        '200': { description: Dependencies ready }
        '503': { description: Dependency unavailable }
  /api/v1/auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 40 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '201': { description: User created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Username/email already exists }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/login:
    post:
      summary: Authenticate and create refresh session
      responses:
        '200': { description: Access token returned; refresh token is an HttpOnly cookie }
        '401': { description: Credentials are invalid }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh session and issue access token
      responses:
        '200': { description: Token rotated }
        '401': { description: Refresh session invalid or expired }
  /api/v1/auth/logout:
    post:
      summary: Revoke refresh session
      responses:
        '204': { description: Session revoked }
  /api/v1/movies:
    get:
      summary: List movies
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200': { description: Paginated catalog }
    post:
      summary: Create movie (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Movie created }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/movies/{movieId}:
    get:
      summary: Get movie and upcoming showtimes
      parameters:
        - in: path
          name: movieId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Movie details }
        '404': { description: Movie not found }
  /api/v1/cinemas:
    get:
      summary: List cinemas with upcoming showtimes for a movie
      parameters:
        - in: query
          name: movieId
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Cinema list }
  /api/v1/cinemas/{cinemaId}:
    get:
      summary: Get cinema, screens, and seats
      parameters:
        - in: path
          name: cinemaId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Cinema detail }
  /api/v1/showtimes:
    get:
      summary: List showtimes for movie, cinema, and local date
      parameters:
        - { in: query, name: movieId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: cinemaId, schema: { type: string, format: uuid } }
        - { in: query, name: date, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Showtime list }
  /api/v1/showtimes/{showtimeId}/seats:
    get:
      summary: Get live seat availability
      parameters:
        - { in: path, name: showtimeId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Seat map and reservation status }
  /api/v1/bookings/holds:
    post:
      summary: Atomically hold 1–8 seats and create a pending booking
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [showtimeId, seatIds]
              properties:
                showtimeId: { type: string, format: uuid }
                seatIds: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { type: string, format: uuid } }
      responses:
        '201': { description: Pending booking with server-calculated price }
        '409': { description: Seat unavailable or idempotency conflict }
  /api/v1/bookings/{bookingId}:
    get:
      summary: Get an owned booking
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bookingId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Booking detail }
        '404': { description: Booking not found }
  /api/v1/bookings/{bookingId}/cancel:
    post:
      summary: Cancel a pending booking and release its seats
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bookingId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Booking cancelled }
        '409': { description: Booking is not cancellable }
  /api/v1/payments/checkout:
    post:
      summary: Create or resume a checkout session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingId]
              properties:
                bookingId: { type: string, format: uuid }
      responses:
        '201': { description: Checkout provider and URL }
        '409': { description: Booking is expired or no longer payable }
  /api/v1/payments/promptpay/checkout:
    post:
      summary: Create or resume a manual PromptPay payment with an amount-bearing QR
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingId]
              properties:
                bookingId: { type: string, format: uuid }
      responses:
        '201': { description: PromptPay payload, amount, reference, and expiry }
        '409': { description: Booking is expired or no longer payable }
  /api/v1/payments/promptpay/{paymentId}:
    get:
      summary: Get the owner's PromptPay payment and booking status
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: paymentId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Payment status and slip review state }
        '404': { description: Payment not found }
  /api/v1/payments/promptpay/{paymentId}/proof:
    post:
      summary: Upload a raw PNG/JPEG transfer slip (max 5 MB)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: paymentId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
      responses:
        '202': { description: Slip stored and awaiting admin review }
        '409': { description: Duplicate slip or expired booking }
        '415': { description: Not a genuine PNG/JPEG image }
  /api/v1/payments/admin/promptpay/review-queue:
    get:
      summary: List PromptPay slips awaiting review (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pending payments with slips }
        '403': { description: Administrator role required }
  /api/v1/payments/admin/promptpay/{paymentId}/proof:
    get:
      summary: Fetch a private slip image (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: paymentId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Slip image bytes (no-store) }
        '404': { description: Proof not found }
  /api/v1/payments/admin/promptpay/{paymentId}/review:
    post:
      summary: Approve or reject a PromptPay slip (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: paymentId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: Payment approved (ticket issued) or rejected }
        '409': { description: Already reviewed, expired, or reservation lost }
  /api/v1/payments/webhooks/stripe:
    post:
      summary: Receive Stripe signed payment events
      parameters:
        - { in: header, name: Stripe-Signature, required: true, schema: { type: string } }
      responses:
        '200': { description: Event accepted or already processed }
        '400': { description: Invalid signature }
  /api/v1/tickets/booking/{bookingId}:
    get:
      summary: Get the owner's active ticket and QR payload
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bookingId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Active digital ticket }
        '404': { description: No active ticket }
  /api/v1/tickets/redeem:
    post:
      summary: Redeem an active ticket once (staff/admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ticket redeemed }
        '409': { description: Ticket already redeemed or unavailable }
  /api/v1/bookings:
    get:
      summary: List current user's bookings
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated booking history }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/bookings/all:
    get:
      summary: List all bookings (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Administrative booking list }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Request limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string, format: uuid }
            details: { type: object }
